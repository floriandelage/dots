[bar.default]
end = [ "volume", "brightness", "network", "session" ]
margin_ends = 600
shadow = false
start = [ "control-center", "workspaces", "tray" ]
widget_spacing = 12

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]
enabled = true

    [calendar.account.personal_icloud]
    credential_source = "file"
    name = "Personal Calender"
    password_file = "/run/agenix/noctalia-caldav"
    provider = "icloud"
    type = "caldav"
    username = "floriandlg@icloud.com"

    [calendar.account.subscription]
    name = "School"
    server_url = "https://ade.bordeaux-inp.fr/jsp/custom/modules/plannings/anonymous_cal.jsp?resources=5043&projectId=1&calType=ical&firstDate=2026-08-17&lastDate=2027-08-22&displayConfigId=71"
    type = "ics"

[control_center]
hidden_tabs = [ "power", "bluetooth" ]
show_session_button = false
show_shortcut_labels = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[location]
address = "Pessac, France"

[lockscreen]
blurred_desktop = true
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@FALLBACK",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

