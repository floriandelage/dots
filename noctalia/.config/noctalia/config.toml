[nightlight]
enabled = true

[osd]
background_opacity = 0.99999997764825821

    [osd.kinds]
    bluetooth = false
    brightness = false
    keyboard_backlight = false
    media = false
    power_profile = false
    privacy = false
    volume = false
    volume_input = false
    volume_output = false

[plugins]
enabled = [ "mellotanica/launcher-pass" ]

[shell]
clipboard_confirm_clear_history = false
font_family = "Iosevka Aile"
password_style = "random"
polkit_agent = true
popup_shadows = false
screen_time_enabled = true

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false
    sort_by_usage = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    session_placement = "floating"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    annotate = true
    directory = "/home/florian/Pictures/Screenshots"

    [shell.session]
    grid_columns = 5
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
