/**
 * Koda Dark
 * Minimal monochrome Rofi theme
 *
 * Matches the Koda Dark Kitty palette.
 */

* {
    background:     #101010;
    foreground:     #ffffff;

    muted:          #777777;
    subtle:         #666666;
    surface:        #272727;
    selected:       #b0b0b0;
}

/* ─────────────────────────────────────────
 * Window
 * ───────────────────────────────────────── */

window {
    width:           600px;
    background-color: @background;
    border:          0px;
    border-radius:   0px;
    padding:         20px;
}

/* ─────────────────────────────────────────
 * Main layout
 * ───────────────────────────────────────── */

mainbox {
    background-color: transparent;
    children:        [ inputbar, listview ];
    spacing:         16px;
}

/* ─────────────────────────────────────────
 * Search bar
 * ───────────────────────────────────────── */

inputbar {
    background-color: @surface;
    text-color:       @foreground;

    border:           0px;
    border-radius:    0px;

    padding:          12px 14px;
    spacing:          10px;

    children:         [ prompt, entry ];
}

prompt {
    background-color: transparent;
    text-color:       @muted;

    padding:          0px;
}

entry {
    background-color: transparent;
    text-color:       @foreground;

    placeholder:      "";
    cursor:            text;
}

/* ─────────────────────────────────────────
 * Application list
 * ───────────────────────────────────────── */

listview {
    background-color: transparent;

    columns:          1;
    lines:            8;

    fixed-height:     false;
    dynamic:          true;

    spacing:          2px;
    scrollbar:        false;
}

/* ─────────────────────────────────────────
 * Entries
 * ───────────────────────────────────────── */

element {
    background-color: transparent;
    text-color:       @foreground;

    orientation:      horizontal;

    padding:          9px 12px;
    spacing:          12px;
}

element-icon {
    background-color: transparent;

    size:             28px;
}

element-text {
    background-color: transparent;
    text-color:       @foreground;

    vertical-align:   0.5;
}

/* Selected application */

element selected {
    background-color: @surface;
    text-color:       @foreground;
}

element selected element-text {
    text-color:       @foreground;
}

element selected element-icon {
    background-color: transparent;
}

/* ─────────────────────────────────────────
 * Scrollbar
 * ───────────────────────────────────────── */

scrollbar {
    handle-width:     4px;
    handle-color:     @subtle;

    border:           0px;
    background-color: transparent;
}

/* ─────────────────────────────────────────
 * Message / error text
 * ───────────────────────────────────────── */

message {
    background-color: transparent;
    text-color:       @muted;

    padding:          10px;
}

textbox {
    background-color: transparent;
    text-color:       @muted;
}
