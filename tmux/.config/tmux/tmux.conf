set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3
bind -r C-l resize-pane -R 5

bind b split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

set -g status-left-length 99
set -g status-right-length 99
set -g status-justify centre

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"

set -g status-left "#{?client_prefix,#[bg=#f38ba8],#[bg=#b4befe]}#[fg=#181825,bold] #S #[bg=#181825,fg=#6c7086]"
set -g status-right "#[bg=#313244,fg=#b4befe,bold] #h "

set -g window-status-separator ""
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

set -g window-status-style "fg=#6c7086,nounderscore"
set -g window-status-current-style "fg=#b4befe,bg=#313244,bold,nounderscore"
set -g window-status-activity-style "fg=#fab387,nounderscore"

set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#b4befe"
